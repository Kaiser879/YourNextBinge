schema-version = 1

[package]
title = "Your Next Binge"
version = "0.1.0"
id = "com.yournextbinge.app"
icon = "@image/app_icon.png"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

# Search: the system keyboard / input method.

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Dev-only: the embedding server runs on the host at 10.0.2.2:8000.
# Remove this when the app no longer talks to the laptop-local server.
[network-traffic-policy.cleartext]
allowed-domains = ["10.0.2.2", "localhost"]

[components]
[[components.interactive]]
id = "com.yournextbinge.app.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
